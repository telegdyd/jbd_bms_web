[project]
name = "bms-web"
version = "0.1.0"
description = "Self-hosted browser for BMS and e-bike recordings made by the BMS Android app"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.12",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bmsweb"]

[tool.pytest.ini_options]
testpaths = ["tests"]
